name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Comment `/review` on a PR to (re)run the review on demand.
  issue_comment:
    types: [created]

# Keep only the latest run per PR. Comments that won't trigger a review (no
# leading `/review`, or not from a trusted author) get their own group so they
# can't cancel a review that's in progress.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number || github.event.issue.number }}${{
    github.event_name == 'issue_comment' && !(startsWith(github.event.comment.body, '/review')
    && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    && format('-comment-{0}', github.event.comment.id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Run on same-repo PR events, or on a "/review" PR comment from a trusted
    # author. issue_comment runs with repo secrets, so anyone outside the repo
    # (or a fork PR's code) must never reach this job.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't leave GITHUB_TOKEN in .git/config for PR code to read.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install before switching to PR code, from outside the checkout, so a
      # PR-supplied .npmrc / package.json can't influence the install.
      - name: Install Claude Code CLI
        working-directory: ${{ runner.temp }}
        run: npm install -g @anthropic-ai/claude-code

      # For comment-triggered runs the checkout lands on the default branch,
      # so switch to the PR head to review the actual proposed code.
      - name: Checkout PR head (comment trigger)
        if: github.event_name == 'issue_comment'
        # Pass the token to this one fetch only, so it isn't persisted on disk.
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch origin "pull/$PR/head"
          git checkout --detach FETCH_HEAD

      # The checked-out tree is untrusted: drop anything Claude Code would load
      # as config (hooks can run arbitrary commands with the secrets in env).
      - name: Remove PR-supplied agent config
        run: rm -rf .claude .mcp.json CLAUDE.md CLAUDE.local.md

      - name: Run Claude review
        env:
          # Subscription auth (no metered billing). Set via `claude setup-token`.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail

          # Strip stray CR/LF from the secret (a line break pasted into the
          # token value makes the Authorization header invalid).
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "${CLAUDE_CODE_OAUTH_TOKEN}" | tr -d '\r\n')"
          export CLAUDE_CODE_OAUTH_TOKEN

          echo "node $(node -v) / npm $(npm -v)"
          echo "claude: $(command -v claude || echo NOT-FOUND)"
          claude --version || true

          gh pr diff "$PR" > pr.diff || { echo "::error::gh pr diff failed"; exit 1; }
          echo "diff bytes: $(wc -c < pr.diff)"

          PROMPT=$(cat <<'EOF'
          You are a senior code reviewer for this repository. The full unified
          diff of the pull request under review is saved in the file ./pr.diff,
          and the repository is checked out in the current working directory.

          Read ./pr.diff, then use Read/Grep/Glob to inspect the surrounding repo
          context when it helps you judge whether a change is correct or risks a
          regression (e.g. check callers of changed functions, and whether new
          data/fields are actually consumed downstream). Explore sparingly — only
          open files that could change your verdict — and make sure you leave
          enough turns to emit the final review; a partial exploration with a
          verdict is far better than running out of turns with no output.

          Focus on:
          - Correctness / logic bugs / edge cases
          - Whether it breaks existing behavior or repo conventions
          - Security issues (leaked credentials, injection, dangerous operations)
          - Clear readability / maintainability problems
          - Missing tests

          Output ONLY the review as GitHub-flavored markdown, no preamble, in
          exactly this structure:

          ## 🤖 Claude Review

          **Verdict:** ✅ Safe to merge / ⚠️ Merge after changes / ❌ Do not merge

          **One-line summary:** ...

          ### Blocking issues (must fix before merge)
          - `file:line` — the concrete defect and how to fix it (write "None" if there are none)

          ### Non-blocking suggestions & things to double-check
          - `file:line` — the suggestion or the assumption worth confirming

          Verdict rules (the verdict MUST follow these):
          - A blocking issue is a concrete, high-confidence defect: a bug, a
            regression, broken behavior, a security problem, or a missing test for
            new critical logic. "Worth confirming", "possibly", "consider", and
            style/coverage nitpicks are NOT blocking — they go under non-blocking.
          - If there is at least one blocking issue → use ❌ Do not merge (or
            ⚠️ Merge after changes if the fix is small and obvious).
          - If the Blocking issues section is "None" → use ✅ Safe to merge, even
            when there are non-blocking suggestions. Never pair ✅ with a blocking
            issue.

          Other rules:
          - Only raise real, high-confidence items; prefix genuinely uncertain
            ones with "possibly" and explain why. Do not add noise.
          - Cite specific files and line numbers.
          - Be concise and factual. This is advisory; a human maintainer makes the
            final merge decision.
          EOF
          )

          set +e
          claude -p "$PROMPT" \
            --setting-sources user \
            --strict-mcp-config \
            --model claude-sonnet-5 \
            --allowedTools "Read,Grep,Glob" \
            --max-turns 60 \
            > review.md 2> claude.err
          code=$?
          set -e

          echo "claude exit: $code"
          echo "----- claude stderr -----"; cat claude.err || true
          echo "----- review.md -----"; cat review.md || true

          if [ "$code" -ne 0 ] || [ ! -s review.md ]; then
            echo "::error::Claude review failed (exit $code) or produced empty output"
            exit 1
          fi

          gh pr comment "$PR" --body-file review.md
