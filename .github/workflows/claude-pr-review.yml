name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Comment `/review` on a PR to (re)run the review on demand.
  issue_comment:
    types: [created]

# Keep only the latest run per PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Run on PR events, or on a PR comment that contains "/review".
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # For comment-triggered runs the checkout lands on the default branch,
      # so switch to the PR head to review the actual proposed code.
      - name: Checkout PR head (comment trigger)
        if: github.event_name == 'issue_comment'
        run: gh pr checkout "$PR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude review
        env:
          # Subscription auth (no metered billing). Set via `claude setup-token`.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail

          echo "node $(node -v) / npm $(npm -v)"
          echo "claude: $(command -v claude || echo NOT-FOUND)"
          claude --version || true

          gh pr diff "$PR" > pr.diff || { echo "::error::gh pr diff failed"; exit 1; }
          echo "diff bytes: $(wc -c < pr.diff)"

          PROMPT=$(cat <<'EOF'
          You are a senior code reviewer for this repository. The full unified
          diff of the pull request under review is saved in the file ./pr.diff,
          and the repository is checked out in the current working directory.

          Read ./pr.diff, then use Read/Grep/Glob to inspect the surrounding repo
          context whenever it helps you judge whether a change is correct or risks
          a regression (e.g. check callers of changed functions, and whether new
          data/fields are actually consumed downstream).

          Focus on:
          - Correctness / logic bugs / edge cases
          - Whether it breaks existing behavior or repo conventions
          - Security issues (leaked credentials, injection, dangerous operations)
          - Clear readability / maintainability problems
          - Missing tests

          Output ONLY the review as GitHub-flavored markdown, no preamble, in
          exactly this structure:

          ## 🤖 Claude Review

          **Verdict:** ✅ Safe to merge / ⚠️ Merge after changes / ❌ Do not merge

          **One-line summary:** ...

          ### Main issues (ordered by severity)
          - `file:line` — problem and suggested fix (write "No blocking issues found" if none)

          ### Minor suggestions
          - ...

          Rules:
          - Only raise real, high-confidence issues; prefix uncertain ones with
            "possibly" and explain why. Do not add noise.
          - Cite specific files and line numbers.
          - Be concise and factual. This is advisory; a human maintainer makes the
            final merge decision.
          EOF
          )

          set +e
          claude -p "$PROMPT" \
            --model claude-sonnet-5 \
            --allowedTools "Read,Grep,Glob" \
            --max-turns 30 \
            > review.md 2> claude.err
          code=$?
          set -e

          echo "claude exit: $code"
          echo "----- claude stderr -----"; cat claude.err || true
          echo "----- review.md -----"; cat review.md || true

          if [ "$code" -ne 0 ] || [ ! -s review.md ]; then
            echo "::error::Claude review failed (exit $code) or produced empty output"
            exit 1
          fi

          gh pr comment "$PR" --body-file review.md
