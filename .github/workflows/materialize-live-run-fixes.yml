name: Materialize reviewed live-run fixes

on:
  push:
    branches: [fix/live-run-review]
    paths: [.github/live-run-review-edits.json, .github/workflows/materialize-live-run-fixes.yml]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.repository == 'pingcap-inc/GEO-Benchmark' && github.ref == 'refs/heads/fix/live-run-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source edits with base-blob checks
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          spec = json.loads(Path('.github/live-run-review-edits.json').read_text())
          spec['edits'][0]['old'] = spec['edits'][0]['old'].replace('coverage["coverage_disposition"]', 'coverage.get("coverage_disposition")')
          allowed = {'geo_benchmark/cli.py', 'geo_benchmark/fact_judge.py', 'geo_benchmark/reports.py', 'geo_benchmark/review_report.py', 'geo_benchmark/scoring.py', 'tools/build_prompts.py'}
          if set(spec['base_blobs']) != allowed:
              raise SystemExit('Unexpected source-edit scope')
          for name, expected in spec['base_blobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'{name}: base changed; review the edits again')
          for index, edit in enumerate(spec['edits']):
              if edit['path'] not in allowed:
                  raise SystemExit('Unexpected edit path')
              path = Path(edit['path'])
              text = path.read_text()
              if text.count(edit['old']) != 1:
                  raise SystemExit(f'{path}: edit {index}: expected exactly one match for {edit["old"]!r}')
              path.write_text(text.replace(edit['old'], edit['new'], 1))
          PY
      - name: Check patch and run all offline tests
        run: |
          git diff --check
          python3 -m compileall -q geo_benchmark tools tests
          python3 -m unittest discover -s tests -v
      - name: Commit tested source edits to this fix branch only
        run: |
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add geo_benchmark/cli.py geo_benchmark/fact_judge.py geo_benchmark/reports.py geo_benchmark/review_report.py geo_benchmark/scoring.py tools/build_prompts.py
          git commit -m 'Integrate verified live-run coverage, taxonomy, and comparison fixes'
          git push origin HEAD:refs/heads/fix/live-run-review
