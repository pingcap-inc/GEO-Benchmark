name: Live run regression tests

on:
  push:
    branches: [fix/live-run-review]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for reproducible local testing
        run: git archive --format=zip HEAD -o /tmp/geo-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: geo-source
          path: /tmp/geo-source.zip
          retention-days: 1
      - name: Run offline test suite
        run: python3 -m unittest discover -s tests -v
